<article class="tone-{gweb::enum_name(props.tone)}"><h1>{props.title}</h1><p class="tone">{props.tone}</p><p class="raw">{props.tone.gw_name_Tone()}</p>{#if props.summary.len > 0}<p class="summary">{props.summary}</p>{/if}{#for l in props.links}<a href="{l.url}">{l.label}</a>{/for}<div class="len">{props.body.len}</div></article>{#var other = Props { .. }}{#if read("{}", other) == 0}<p class="var">{other.tone}</p>{/if}
